apis:
- name: Neurophos Site MCP
  description: >-
    A live, unauthenticated Model Context Protocol endpoint served from the neurophos.com
    host and advertised in the company's own llms.txt. It is provided by the Wix site
    platform rather than authored by Neurophos, and exposes nine tools over the public
    marketing site — business details, site search, site API-doc search, anonymous
    visitor-token minting, and generic Wix REST call/execute tools. No tool exposes the
    T100 OPU, its runtime, or any Neurophos compute service; this is a site-content agent
    surface, not a product API.
  humanURL: https://www.neurophos.com/llms.txt
