aid: neurophos
name: Neurophos
description: >-
  Neurophos is an Austin, Texas semiconductor company, spun out of Duke University in
  2020, building photonic AI inference silicon. Its Optical Processing Unit (OPU)
  integrates over a million micron-scale dynamic optical metasurface modulators —
  technology descended from metamaterials research — onto a single chip, performing the
  matrix multiplications behind AI inference in light rather than electrons. The company
  markets the T100 OPU as a drop-in data-center alternative to GPUs, publishing chip and
  server configurations rated at 235 TOPS/W with HBM-backed memory, and lists Triton and
  JAX as supported software frameworks. Neurophos raised a $110M Series A in January 2026
  led by Gates Frontier with M12, Carbon Direct, Aramco Ventures and Bosch Ventures. It
  sells hardware, not software services: there is no developer program, no public API and
  no SDK. The only machine-readable surfaces at its domain are an llms.txt and the
  Wix-platform site MCP endpoint that llms.txt advertises.
